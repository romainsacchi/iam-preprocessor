# Run settings for REMIND 3.5.2 exports using these variable names and units.
# Opening maximum lifetimes for capacity come from SSP2-EU21-NPi2025 in 2005.
# stock-config applies these settings to every region in your scenario file.
# The solar PV example explains the fields used throughout this file.

# Version of the stock settings format.
schema_version: 2

# First and last year of the reconstruction.
reference_year: 2005
end_year: 2100

# One entry for each asset group to reconstruct.
assets:

  # Electricity generation
  - id: pv  # Short name for solar PV in the results.
    # & gives these settings a name. << applies them to this asset.
    # Later assets reuse them with <<: *remind_stock_settings.
    <<: &remind_stock_settings
      # Use installed stock to calculate additions after accounting for retirements.
      mode: stock

      # If more capacity survives than REMIND reports, retire the same
      # fraction from each surviving build-year group to match the total.
      exit_policy: proportional

      # How to read the reported additions.
      inflow_timing:
        # Treat each value as the additions in the year shown in its column.
        kind: sampled_annual
        # Explain why this timing rule is used.
        provenance: Each reported addition rate applies to the year in its column.

      # How to estimate each build-year group's share of service, such as generation.
      service_weighting:
        # Give each unit of surviving capacity the same use.
        kind: equal
        # Zero means use per unit stays the same as the equipment ages.
        annual_age_decay: 0
        # Explain the assumption about use.
        provenance: Each unit still in use supplies the same amount of service.

    # Installed solar PV capacity.
    stock:
      variable: "Cap|Electricity|Solar|+|PV"  # Exact variable name in the scenario.
      unit: "GW"  # Unit for installed capacity, as written in the scenario.

    # New solar PV capacity added per year.
    inflow:
      variable: "New Cap|Electricity|Solar|+|PV"  # Exact variable name in the scenario.
      unit: "GW/yr"  # Unit for annual additions, as written in the scenario.

    # How long PV capacity stays in use.
    lifetime:
      # Name these lifetime settings so other capacity assets can reuse them.
      <<: &capacity_lifetime
        # Survival declines with age and reaches zero at the maximum lifetime.
        distribution: quartic
        # Explain what the lifetime value represents.
        interpretation: REMIND reports the maximum lifetime for a quartic curve.
        # Give the source for this interpretation.
        provenance: "Technical note: Lifetimes in REMIND (2026-03-23)."

      # Use a 30-year maximum for PV already in use in 2005.
      # This value comes from the 2005 entry of the lifetime row below.
      initial_maximum: 30

      # For later builds, use the lifetime reported for their build year.
      source:
        variable: "Tech|Electricity|Solar|PV|Lifetime"  # Exact lifetime variable.
        unit: years  # Unit as written in the scenario.

    # Estimate the ages of PV capacity already in use in 2005.
    # &starting_ages lets other assets reuse these starting-stock settings.
    initial: &starting_ages
      # Assume steady past additions. Apply the lifetime curve and scale
      # the surviving groups to the total capacity REMIND reports for 2005.
      kind: equilibrium
      # Look back up to 30 years when estimating the starting age mix.
      maximum_age: 30
      # Confirm that the starting ages are based on an assumption.
      acknowledge_prior: true
      # Record the assumption used for the starting ages.
      provenance: Assume steady past additions to estimate starting ages.

  - id: ccgt
    # Reuse the shared settings from the PV example.
    <<: *remind_stock_settings
    stock: {variable: "Cap|Electricity|Gas|CC|+|w/o CC", unit: "GW"}
